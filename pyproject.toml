[project]
name = "garmin-golf"
version = "0.1.0"
description = "Extraccion y analisis de data de golf de Garmin (Approach S62)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.2.25",
    "garth>=0.5.7",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
server = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
analyze = [
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.scripts]
garmin-golf = "garmin_golf.fetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_golf"]
