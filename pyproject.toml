[project]
name = "caddie"
version = "0.1.0"
description = "Caddie Virtual: extraccion y analisis de tu propia data de golf de Garmin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.2.25",
    "garth>=0.5.7",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
server = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
analyze = [
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.scripts]
caddie = "app.fetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
